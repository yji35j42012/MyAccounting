<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" data-cashflow-supabase-client="true"></script>
	<script src="./js/supabase-auth-config.js?v=supabase-auth-v1.0.5-2026.08.27"
		data-cashflow-auth-config="true"></script>
</head>

<body>


	<script>
		(function () {
			// https://zojzhbwwqrsuvpvjomwy.supabase.co/rest/v1/
			// sb_publishable_JEwm1VmdMqi_N-2QyMGEFA_YkH7cVeX

			const SUPABASE_URL = 'https://zojzhbwwqrsuvpvjomwy.supabase.co'
			const SUPABASE_ANON_KEY = 'sb_publishable_JEwm1VmdMqi_N-2QyMGEFA_YkH7cVeX'

			if (!window.supabase) {
				console.error('Supabase SDK 尚未載入')
				return
			}

			if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
				console.error('Supabase URL 或 Key 尚未設定');
				return
			}

			// 不要覆蓋 window.supabase，因為它是 SDK 本身的全域物件。
			// 建議將建立好的 client 放到 window.supabaseClient。
			window.supabaseClient = window.supabase.createClient(
				SUPABASE_URL.trim(),
				SUPABASE_ANON_KEY.trim()
			)
			console.log('Supabase client 初始化完成')
		})()

		async function loadTodos() {
			const { data, error } = await window.supabaseClient
				.from('fund_purchase_records')
				.select('*')

			if (error) {
				console.error('讀取資料失敗：', error)
				return
			}

			console.log('讀取成功：', data)
		}

		loadTodos()
	</script>
</body>

</html>
