<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Alex</title>
	<link rel="stylesheet" href="./style/css/all.css">

</head>

<body>
	<div id="app" class="wrap">
		<div class="header">
			<div class="header_title">
				<div class="header_title_icon">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
						stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
						data-loc="client/src/components/Navigation.tsx:25">
						<path d="M3 3v16a2 2 0 0 0 2 2h16"></path>
						<path d="M18 17V9"></path>
						<path d="M13 17V5"></path>
						<path d="M8 17v-3"></path>
					</svg>
				</div>
				<h1 class="header_title_h1" data-en="CashFlow Manager">現金流管理</h1>
			</div>
			<div class="nav">
				<router-link class="nav_link" to="/">儀錶板</router-link>
				<router-link class="nav_link" to="/acc">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
						stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
						class="lucide lucide-list w-4 h-4" data-loc="client/src/components/Navigation.tsx:49">
						<path d="M3 12h.01"></path>
						<path d="M3 18h.01"></path>
						<path d="M3 6h.01"></path>
						<path d="M8 12h13"></path>
						<path d="M8 18h13"></path>
						<path d="M8 6h13"></path>
					</svg>
					交易列表
				</router-link>
			</div>
			<!-- <router-link to="/news">新聞</router-link> -->
		</div>
		<div :class="['content',nowPage]">
			<router-view></router-view>
		</div>
		<loading v-if="showLoading"></loading>
		<!-- <loading ></loading> -->
	</div>

	<script src="./js/libs/axios.js"></script>
	<script src="https://unpkg.com/vue@latest"></script>
	<script src="./js/libs/vue3-sfc-loader.js"></script>
	<script src="./js/libs/vue-router_4_3_2.js"></script>
	<script src="./js/libs/vuex_3_0_1.js"></script>
	<script src="./store/store.js"></script>
	<script src="./js/mixinJs.js"></script>
	<script src="./js/route.js"></script>
	<script src="https://unpkg.com/xml2js/dist/xml2js.min.js"></script>
	<script>
		const options = {
			moduleCache: {
				vue: Vue
			},
			async getFile(url) {
				const res = await fetch(url);
				if (!res.ok)
					throw Object.assign(new Error(res.statusText + ' ' + url), { res });
				return {
					getContentData: asBinary => asBinary ? res.arrayBuffer() : res.text(),
				}
			},
			addStyle(textContent) {
				const style = Object.assign(document.createElement('style'), { textContent });
				const ref = document.head.getElementsByTagName('style')[0] || null;
				document.head.insertBefore(style, ref);
			},
		}
		const { loadModule } = window['vue3-sfc-loader'];

		const app = Vue.createApp({
			// mixins: [url],
			data() {
				return {
					nowPage: "",
					loadingShow: true,
					title: 'alex',
				}
			},
			mounted() {
				// document.addEventListener("visibilitychange", function () {
				// 	if (!document.hidden) {
				// 		// 當頁面重新被顯示時，重新整理
				// 		location.reload();
				// 	}
				// });
			},
			watch: {
				$route(to, from) {
					store.dispatch("SET_LOADING_ACTION", true);
					var now = this.$route.path;
					if (now == "/" || now == 'home') {
						this.nowPage = "home";
					} else {
						this.nowPage = now.split("/")[1];
					}
				},
			},
			computed: {
				showLoading() {
					return this.$store.state.showLoading;
				}
			},
			components: {
				'loading': Vue.defineAsyncComponent(() => loadModule('./components/Loading.vue', options)),
				// 'header-component': Vue.defineAsyncComponent(() => loadModule('./components/HeaderComponent.vue', options)),
				// 'right-panel': Vue.defineAsyncComponent(() => loadModule('./components/RightPanel.vue', options)),
			},
			methods: {

			}
		});
		app.use(router);
		app.use(store);
		app.mount('#app');
	</script>

</body>

</html>
