	<script>
		const options = {
			moduleCache: {
				vue: Vue
			},
			async getFile(url) {
				const res = await fetch(url);
				if (!res.ok)
					throw Object.assign(new Error(res.statusText + ' ' + url), { res });
				return {
					getContentData: asBinary => asBinary ? res.arrayBuffer() : res.text(),
				}
			},
			addStyle(textContent) {
				const style = Object.assign(document.createElement('style'), { textContent });
				const ref = document.head.getElementsByTagName('style')[0] || null;
				document.head.insertBefore(style, ref);
			},
		}
		const { loadModule } = window['vue3-sfc-loader'];

		const app = Vue.createApp({
			// mixins: [url],
			data() {
				return {
					nowPage: "",
					loadingShow: true,
					title: 'alex',
					authSession: null,
				}
			},
			mounted() {
				console.log(FUND_ANALYSIS_COMPONENT_VERSION);
				console.log(FUND_PURCHASE_COMPONENT_VERSION);
				console.log(REPORT_COMPONENT_VERSION);
				console.log(AUTH_COMPONENT_VERSION);


				this.setNowPage();
				this.authChangeHandler = (event) => {
					this.authSession = event.detail?.session || null;
				};
				window.addEventListener('cashflow-auth-change', this.authChangeHandler);
				const auth = window.CASHFLOW_SUPABASE_AUTH;
				if (!auth) return;
				Promise.resolve()
					.then(() => auth.subscribe())
					.catch(() => {
						this.authSession = null;
					});
				auth.getSession()
					.then((session) => {
						this.authSession = session || null;
					})
					.catch(() => {
						this.authSession = null;
					});

			},
			beforeUnmount() {
				window.removeEventListener('cashflow-auth-change', this.authChangeHandler);
			},
			watch: {
				$route(to, from) {
					store.dispatch("SET_LOADING_ACTION", true);
					this.setNowPage();
					var now = this.$route.path;
					if (now == "/" || now == 'home') {
						this.nowPage = "home";
					} else {
						this.nowPage = now.split("/")[1];
					}
				},
			},
			computed: {
				showLoading() {
					return this.$store.state.showLoading;
				}
			},
			components: {
				'loading': Vue.defineAsyncComponent(() => loadModule('./components/Loading.vue', options)),
				'auth-panel': Vue.defineAsyncComponent(() => loadModule(`./components/AuthPanel.vue?v=${ AUTH_COMPONENT_VERSION }`, options)),
			},
			methods: {
				setNowPage() {
					const now = this.$route.path;
					this.nowPage = now === "/" || now === 'home' ? "home" : now.split("/")[1];
				},
			}
		});
		app.use(router);
		app.use(store);
		app.mount('#app');
	</script>
